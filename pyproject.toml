[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tasktrack"
version = "1.0.0"
description = "A local work board for people and independent coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Nate McGuire"}]
dependencies = []

[project.scripts]
tt = "tasktrack.cli:main"

[tool.setuptools]
packages = ["tasktrack"]
include-package-data = false

[tool.setuptools.package-data]
tasktrack = ["static/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
