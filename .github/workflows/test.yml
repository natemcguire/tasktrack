name: Verify Tasktrack
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python tests/mutation_checks.py
      - run: python tests/capture_api.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/screenshots
            docs/browser-verification.json
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:hosted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-evidence
          path: |
            docs/screenshots/hosted-*.png
            docs/screenshots/task-preview.png
            docs/hosted-verification.json
