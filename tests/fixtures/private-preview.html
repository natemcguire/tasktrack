<!doctype html><html><meta name="viewport" content="width=device-width"><title>Private preview fixture</title><style>body{font:16px system-ui;padding:16px}section{display:none}section.active{display:block}</style><label>Screen <select id="screen-select"><option value="invoice">Invoice</option><option value="access">Access</option></select></label><section id="invoice">Invoice layout</section><section id="access">Access layout</section><script>const select=document.querySelector('select');function show(){document.querySelectorAll('section').forEach(x=>x.classList.toggle('active',x.id===select.value));}select.value=location.hash.slice(1)||'invoice';select.onchange=show;show();</script></html>
